<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in Entry</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:#fffbf5;color:#1e293b;font-size:15px;line-height:1.5;min-height:100vh}
.app-header{background:#fffdf9;border-bottom:1px solid #e2e8f0;padding:0 24px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.app-header h1{font-size:16px;font-weight:600;flex:1}
.mode-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;background:#fff7ed;color:#c2410c}
.main-container{max-width:860px;margin:0 auto;padding:28px 20px 80px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px 24px;margin-bottom:16px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:16px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
.form-group select,.form-group input,.form-group textarea{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;font-family:inherit;color:#1e293b;background:#fff;transition:border-color .15s}
.form-group select:focus,.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.select-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
@media(max-width:600px){.select-row{grid-template-columns:1fr}}
.slider-wrap{display:flex;align-items:center;gap:14px}
.slider-wrap input[type=range]{flex:1;accent-color:#f97316;cursor:pointer}
.slider-val{font-size:22px;font-weight:700;color:#f97316;min-width:54px;text-align:right}
.flags-card{background:#fff8f0;border:1px solid #fed7aa;border-radius:14px;padding:22px 24px;margin-bottom:16px}
.flags-card .card-title{color:#c2410c}
.flags-card textarea{border-color:#fed7aa;background:#fffbf5}
.flags-card textarea:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.status-section{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:22px 24px;margin-bottom:16px}
.status-section .card-title{color:#f97316}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:#f97316;color:#fff}
.btn-primary:hover{background:#ea580c}
.btn-primary:disabled{background:#fdba74;cursor:not-allowed}
.btn-secondary{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-full{width:100%;justify-content:center;padding:12px}
.manage-panel{border:1px solid #e2e8f0;border-radius:14px;background:#fff;margin-bottom:16px;overflow:hidden}
.manage-panel-header{padding:14px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.manage-panel-body{padding:20px}
.project-list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.project-list-item:last-child{border-bottom:none}
.project-list-item span{flex:1;font-size:14px}
.project-list-item small{color:#94a3b8;font-size:12px}
.add-project-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0}
@media(max-width:700px){.add-project-row{grid-template-columns:1fr}}
.stream-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px}
.stream-research{background:#fff7ed;color:#c2410c}
.stream-policy{background:#dbeafe;color:#1d4ed8}
.stream-public-engagement{background:#dcfce7;color:#15803d}
.stream-ongoing{background:#fef3c7;color:#b45309}
.stream-internal{background:#f1f5f9;color:#475569}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 22px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:#166534}
.toast.error{background:#991b1b}
.loading-overlay{position:fixed;inset:0;background:rgba(255,251,245,.9);display:flex;align-items:center;justify-content:center;z-index:200}
.loading-overlay.hidden{display:none}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#f97316;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.text-muted{color:#94a3b8;font-size:13px}
.entries-panel{border:1px solid #e2e8f0;border-radius:14px;background:#fff;margin-bottom:16px;overflow:hidden}
.entries-panel-header{padding:14px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.entries-panel-body{padding:0}
.entry-row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid #f1f5f9;font-size:14px}
.entry-row:last-child{border-bottom:none}
.entry-row-main{flex:1;min-width:0}
.entry-row-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-row-meta{font-size:12px;color:#94a3b8;margin-top:1px}
.entry-row-cap{font-size:13px;font-weight:600;color:#f97316;min-width:40px;text-align:right}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:400;display:none}
.modal-backdrop.open{display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.modal-header{padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;line-height:1;padding:4px}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;gap:10px;justify-content:flex-end}
.section-divider{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin:18px 0 12px}

/* === Blue Bubble 3D Theme === */
body{background:linear-gradient(135deg,#050d2e 0%,#0a1a5c 45%,#061022 100%)!important;min-height:100vh}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 32%,rgba(147,197,253,.22) 0%,rgba(59,130,246,.06) 55%,transparent 100%);border:1px solid rgba(147,197,253,.18);animation:bubbleFloat linear infinite;box-shadow:inset 0 0 24px rgba(147,197,253,.08),0 0 24px rgba(59,130,246,.08)}
@keyframes bubbleFloat{0%{transform:translateY(105vh) scale(.3);opacity:0}5%{opacity:.7}92%{opacity:.4}100%{transform:translateY(-140px) scale(1);opacity:0}}
.container,.main-container,.dash-container{position:relative;z-index:1}
.app-header{background:rgba(5,13,46,.75)!important;backdrop-filter:blur(14px);border-bottom:1px solid rgba(147,197,253,.12)!important}
.app-header h1,.dash-header h2,.section-heading,.cal-nav h2{color:#e0f2fe!important}
.mode-badge{background:rgba(59,130,246,.18)!important;color:#93c5fd!important}
.card,.proj-card,.summary-card,.manage-panel,.entries-panel,.status-section,.qa-accordion,.cal-grid,.history-entry,.flag-item,.modal{background:rgba(255,255,255,.06)!important;backdrop-filter:blur(18px);border:1px solid rgba(147,197,253,.14)!important;box-shadow:0 8px 32px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.09)!important;color:#e0f2fe}
.card:hover,.proj-card:hover,.summary-card:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(0,0,0,.55),0 4px 16px rgba(59,130,246,.18),inset 0 1px 0 rgba(255,255,255,.12)!important;transition:all .2s}
.flags-section{background:rgba(239,68,68,.07)!important;border-color:rgba(239,68,68,.18)!important}
.card-title,.form-group label,.info-label,.proj-card-label,.sort-label,.history-field .lbl,.no-date-label,.section-divider{color:#7dd3fc!important}
.proj-card-lead,.proj-lead,.text-muted,.entry-row-meta{color:#64748b!important}
.proj-card-name,.proj-name,.proj-card-value,.info-value,.entry-row-name,.summary-card .val,.flag-item .txt,.qa-response .resp-text,.history-field .val,.project-list-item span{color:#e0f2fe!important}
.summary-card .lbl{color:#7dd3fc!important}
.summary-card.warn .val{color:#fbbf24!important}
.summary-card.flag .val{color:#f87171!important}
.info-value.overdue,.proj-card-value.overdue{color:#f87171!important}
.form-group select,.form-group input,.form-group textarea,.week-select,.sort-select{background:rgba(255,255,255,.07)!important;border-color:rgba(147,197,253,.18)!important;color:#e0f2fe!important}
.form-group select:focus,.form-group input:focus,.form-group textarea:focus{border-color:#3b82f6!important;box-shadow:0 0 0 3px rgba(59,130,246,.22)!important}
.btn-primary{background:linear-gradient(135deg,#3b82f6 0%,#1d4ed8 100%)!important;box-shadow:0 4px 16px rgba(59,130,246,.4),0 2px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18)!important;color:#fff!important}
.btn-primary:hover{background:linear-gradient(135deg,#60a5fa 0%,#3b82f6 100%)!important;box-shadow:0 6px 22px rgba(59,130,246,.55),inset 0 1px 0 rgba(255,255,255,.2)!important;transform:translateY(-1px)}
.btn-secondary{background:rgba(255,255,255,.07)!important;border-color:rgba(147,197,253,.18)!important;color:#93c5fd!important}
.btn-secondary:hover{background:rgba(255,255,255,.12)!important}
.btn-danger{background:rgba(239,68,68,.13)!important;border-color:rgba(239,68,68,.28)!important;color:#fca5a5!important}
.filter-btn{background:rgba(255,255,255,.06)!important;border-color:rgba(147,197,253,.18)!important;color:#93c5fd!important}
.filter-btn:hover{border-color:#60a5fa!important;color:#60a5fa!important}
.filter-btn.active{background:linear-gradient(135deg,#3b82f6,#1d4ed8)!important;border-color:#3b82f6!important;color:#fff!important;box-shadow:0 4px 14px rgba(59,130,246,.38)!important}
.view-toggle{border-color:rgba(147,197,253,.18)!important}
.view-btn{background:rgba(255,255,255,.06)!important;color:#93c5fd!important}
.view-btn+.view-btn{border-left-color:rgba(147,197,253,.18)!important}
.view-btn.active{background:linear-gradient(135deg,#3b82f6,#1d4ed8)!important;color:#fff!important}
.spinner{border-color:rgba(147,197,253,.18)!important;border-top-color:#3b82f6!important}
.loading-overlay{background:rgba(5,13,46,.88)!important}
.slider-wrap input[type=range]{accent-color:#3b82f6!important}
.slider-val,.entry-row-cap,.qa-response .proj-name,.qa-cap .proj-name,.history-field .cap-big,.qa-cap .cap-num{color:#60a5fa!important}
.cap-bar-fill{background:#3b82f6!important}
#passwordGate{background:rgba(5,13,46,.96)!important}
#passwordGate>div{background:rgba(255,255,255,.07)!important;backdrop-filter:blur(22px);border:1px solid rgba(147,197,253,.18)!important}
#passwordGate h2{color:#e0f2fe!important}
#passwordGate p{color:#93c5fd!important}
#passwordGate input{background:rgba(255,255,255,.07)!important;border-color:rgba(147,197,253,.18)!important;color:#e0f2fe!important}
#passwordGate button{background:linear-gradient(135deg,#3b82f6,#1d4ed8)!important;box-shadow:0 4px 16px rgba(59,130,246,.4)!important}
.qa-item-header{background:rgba(255,255,255,.04)!important;color:#e0f2fe!important}
.qa-item-header:hover{background:rgba(255,255,255,.08)!important}
.qa-item-header .count{background:rgba(255,255,255,.09)!important;color:#93c5fd!important}
.qa-item,.flag-item:last-child,.history-entry,.project-list-item{border-color:rgba(147,197,253,.08)!important}
.slideover{background:rgba(5,13,46,.97)!important;backdrop-filter:blur(22px)}
.slideover-header{background:rgba(5,13,46,.9)!important;border-color:rgba(147,197,253,.12)!important}
.slideover-header h3{color:#e0f2fe!important}
.modal-header{background:rgba(5,13,46,.92)!important;border-color:rgba(147,197,253,.12)!important}
.modal-header h3{color:#e0f2fe!important}
.modal-close{color:#7dd3fc!important}
.modal-footer{border-color:rgba(147,197,253,.12)!important}
.manage-panel-header,.entries-panel-header{background:rgba(255,255,255,.04)!important;color:#e0f2fe!important;border-color:rgba(147,197,253,.1)!important}
.cal-weekday{color:#7dd3fc!important}
.cal-day-num{color:#93c5fd!important}
.cal-cell.other-month .cal-day-num{color:rgba(147,197,253,.25)!important}
.cal-cell.today{background:rgba(59,130,246,.1)!important}
.cal-cell.today .cal-day-num{background:#3b82f6!important;color:#fff!important}
.cal-cell{border-color:rgba(147,197,253,.07)!important}
.cal-nav-btn{background:rgba(255,255,255,.07)!important;border-color:rgba(147,197,253,.18)!important;color:#93c5fd!important}
.no-date-chip{background:rgba(255,255,255,.06)!important;border-color:rgba(147,197,253,.18)!important;color:#93c5fd!important}
.stream-Research,.stream-research{background:rgba(167,139,250,.18)!important;color:#c4b5fd!important}
.stream-badge.stream-research{background:rgba(167,139,250,.18)!important;color:#c4b5fd!important}
.flag-item .proj,.history-entry-date{color:#7dd3fc!important}
.setup-banner{background:rgba(251,191,36,.07)!important;border-color:rgba(251,191,36,.2)!important;color:#fde68a!important}
</style>
</head>
<body>
<div id="bubbles"></div>

<div id="passwordGate" style="position:fixed;inset:0;background:#fffbf5;display:flex;align-items:center;justify-content:center;z-index:1000">
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:40px;max-width:360px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)">
    <div style="font-size:28px;margin-bottom:12px">📋</div>
    <h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Check-in Entry</h2>
    <p style="font-size:14px;color:#64748b;margin-bottom:24px">Enter the team password to continue.</p>
    <input type="password" id="passwordInput" placeholder="Password" style="width:100%;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;margin-bottom:12px;font-family:inherit;outline:none" onkeydown="if(event.key==='Enter')checkPassword()">
    <button onclick="checkPassword()" style="width:100%;padding:11px;background:#f97316;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer">Enter</button>
    <div id="pwError" style="color:#ef4444;font-size:13px;margin-top:10px;display:none">Incorrect password. Try again.</div>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>
<div id="toast" class="toast"></div>

<div class="app-header">
  <h1>Weekly Project Check-in</h1>
  <span class="mode-badge">Entry</span>
  <button class="btn btn-primary btn-sm" onclick="toggleNewEntry()">+ New Entry</button>
  <button class="btn btn-secondary btn-sm" onclick="toggleEntries()">Past Entries</button>
  <button class="btn btn-secondary btn-sm" onclick="toggleManage()">Manage Projects</button>
</div>

<div class="main-container">

  <!-- Past entries panel -->
  <div id="entriesPanel" class="entries-panel hidden">
    <div class="entries-panel-header">
      <span>Past Entries</span>
      <button class="btn btn-secondary btn-sm" onclick="toggleEntries()">Close</button>
    </div>
    <div class="entries-panel-body" id="entriesListEl"></div>
  </div>

  <!-- Edit entry modal -->
  <div id="editModalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeEditModal()">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Entry</h3>
        <button class="modal-close" onclick="closeEditModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Project</label>
          <input type="text" id="editProjectName" readonly style="background:#f8fafc">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="editDate">
          </div>
          <div class="form-group">
            <label>Capacity</label>
            <div class="slider-wrap">
              <input type="range" id="editCapacity" min="0" max="100" step="5" oninput="document.getElementById('editCapacityVal').textContent=this.value+'%'">
              <span class="slider-val" id="editCapacityVal">70%</span>
            </div>
          </div>
        </div>
        <div class="section-divider">Check-in Questions</div>
        <div class="form-group"><label>Challenges</label><textarea id="editChallenges" rows="2"></textarea></div>
        <div class="form-group"><label>Delays</label><textarea id="editDelays" rows="2"></textarea></div>
        <div class="form-group"><label>Needs</label><textarea id="editNeeds" rows="2"></textarea></div>
        <div class="form-group"><label>Environment changes</label><textarea id="editEnvChanges" rows="2"></textarea></div>
        <div class="form-group"><label>Vibe check</label><textarea id="editVibeCheck" rows="2"></textarea></div>
        <div class="form-group"><label>Important flags</label><textarea id="editFlags" rows="2"></textarea></div>
        <div class="section-divider">Project Status</div>
        <div class="form-row">
          <div class="form-group">
            <label>General status</label>
            <select id="editStatusGeneral">
              <option>On Track</option><option>At Risk</option><option>Delayed</option><option>Complete</option><option>On Hold</option>
            </select>
          </div>
          <div class="form-group">
            <label>Current stage</label>
            <input type="text" id="editStatusStage">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Stage date</label>
            <input type="date" id="editStatusStageDate">
          </div>
          <div class="form-group">
            <label>Projected completion date</label>
            <input type="date" id="editStatusProjDeadline">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" onclick="deleteEntry()">Delete entry</button>
        <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEditedEntry()">Save changes</button>
      </div>
    </div>
  </div>

  <!-- Manage projects panel -->
  <div id="managePanel" class="manage-panel hidden">
    <div class="manage-panel-header">
      Projects
      <button class="btn btn-secondary btn-sm" onclick="toggleManage()">Done</button>
    </div>
    <div class="manage-panel-body">
      <div id="projectListEl"><p class="text-muted">Loading...</p></div>
      <div class="add-project-row">
        <div class="form-group" style="margin:0">
          <label>Project Name</label>
          <input type="text" id="newProjectName" placeholder="e.g. Biodiversity Survey">
        </div>
        <div class="form-group" style="margin:0">
          <label>Project Lead</label>
          <input type="text" id="newProjectLead" placeholder="e.g. Dr. Smith">
        </div>
        <div class="form-group" style="margin:0">
          <label>Stream</label>
          <select id="newProjectStream">
            <option value="">— Select —</option>
            <option value="Research">Research</option>
            <option value="Policy">Policy</option>
            <option value="Public Engagement">Public Engagement</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Internal">Internal</option>
          </select>
        </div>
        <button class="btn btn-primary btn-sm" style="align-self:flex-end" onclick="addProject()">Add</button>
      </div>
    </div>
  </div>

  <!-- New entry form -->
  <div id="newEntrySection" class="hidden">

  <!-- Meeting details -->
  <div class="card">
    <div class="card-title">Meeting Details</div>
    <div class="select-row">
      <div class="form-group" style="margin:0">
        <label>Project Lead</label>
        <select id="leadSelect" onchange="filterProjects()">
          <option value="">— Select lead —</option>
        </select>
      </div>
      <div class="form-group" style="margin:0">
        <label>Project</label>
        <select id="projectSelect">
          <option value="">— Select project —</option>
        </select>
      </div>
      <div class="form-group" style="margin:0">
        <label>Date</label>
        <input type="date" id="meetingDate">
      </div>
    </div>
  </div>

  <!-- Form -->
  <div id="formSection" class="hidden">
    <div class="card">
      <div class="card-title">Check-in Questions</div>
      <div class="form-group">
        <label>1. Out of 100%, how would you rate your capacity this week?</label>
        <div class="slider-wrap">
          <input type="range" id="capacitySlider" min="0" max="100" step="5" value="70" oninput="document.getElementById('capacityVal').textContent=this.value+'%'">
          <div class="slider-val" id="capacityVal">70%</div>
        </div>
      </div>
      <div class="form-group">
        <label>2. Are you experiencing any challenges, roadblocks, or bottlenecks?</label>
        <textarea id="qChallenges" placeholder="Describe any challenges..."></textarea>
      </div>
      <div class="form-group">
        <label>3. Are you experiencing any delays, or do you foresee any delays?</label>
        <textarea id="qDelays" placeholder="Describe any delays or anticipated delays..."></textarea>
      </div>
      <div class="form-group">
        <label>4. Is there anything that you need?</label>
        <textarea id="qNeeds" placeholder="Resources, decisions, support..."></textarea>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label>5. Has anything changed in the external or internal environment relevant to the project or its release date?</label>
        <textarea id="qEnvChanges" placeholder="Any relevant changes..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Vibe Check</div>
      <div class="form-group" style="margin-bottom:0">
        <label>6. How is the project team feeling?</label>
        <textarea id="qVibeCheck" placeholder="Team morale, energy, concerns..."></textarea>
      </div>
    </div>

    <div class="flags-card">
      <div class="card-title">⚠ Important Flags</div>
      <div class="form-group" style="margin-bottom:0">
        <label style="color:#c2410c">Critical issues that need immediate attention</label>
        <textarea id="qFlags" placeholder="Flag anything that needs urgent follow-up..." style="min-height:70px"></textarea>
      </div>
    </div>

    <div class="status-section">
      <div class="card-title">Project Status Update</div>
      <div class="form-row">
        <div class="form-group">
          <label>General Status</label>
          <select id="statusGeneral">
            <option>On Track</option>
            <option>At Risk</option>
            <option>Delayed</option>
            <option>On Hold</option>
            <option>Complete</option>
          </select>
        </div>
        <div class="form-group">
          <label>Current Stage</label>
          <input type="text" id="statusStage" placeholder="e.g. Data collection">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Stage Date</label>
          <input type="date" id="statusStageDate">
        </div>
        <div class="form-group">
          <label>Projected completion date</label>
          <input type="date" id="statusProjDeadline">
        </div>
      </div>
    </div>

    <button class="btn btn-primary btn-full" id="saveBtn" onclick="saveMeeting()">Save Meeting Notes</button>
  </div>

  </div> <!-- end newEntrySection -->
</div>

<script>
const FIREBASE_URL = '__FIREBASE_URL__';
const FIREBASE_API_KEY = '__FIREBASE_API_KEY__';
const SITE_PASSWORD = '__SITE_PASSWORD__';
const AUTH_KEY = 'wpu_auth';

let appData = { projects: [], meetings: [] };
let _authToken = null;

async function getAuthToken() {
  if (_authToken) return _authToken;
  try {
    const res = await fetch(
      `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ returnSecureToken: true }) }
    );
    const d = await res.json();
    _authToken = d.idToken || null;
  } catch(e) { _authToken = null; }
  return _authToken;
}

// ── Auth ─────────────────────────────────────────────────────
function checkPassword() {
  if (document.getElementById('passwordInput').value === SITE_PASSWORD) {
    localStorage.setItem(AUTH_KEY, SITE_PASSWORD);
    document.getElementById('passwordGate').style.display = 'none';
    init();
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
  }
}

// ── Init ─────────────────────────────────────────────────────
async function init() {
  if (localStorage.getItem(AUTH_KEY) !== SITE_PASSWORD) return;
  document.getElementById('passwordGate').style.display = 'none';
  const t = new Date();
  document.getElementById('meetingDate').value =
    t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
  await loadData();
  populateLeads();
}

// ── Data ─────────────────────────────────────────────────────
async function loadData() {
  showLoading(true);
  try {
    const token = await getAuthToken();
    const url = FIREBASE_URL + '?t=' + Date.now() + (token ? '&auth=' + token : '');
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data) {
      appData = { projects: data.projects || [], meetings: data.meetings || [] };
      localStorage.setItem('wpu_cache', JSON.stringify(appData));
    }
  } catch(e) {
    const cached = localStorage.getItem('wpu_cache');
    if (cached) appData = JSON.parse(cached);
  }
  showLoading(false);
}

async function saveData() {
  localStorage.setItem('wpu_cache', JSON.stringify(appData));
  try {
    const token = await getAuthToken();
    const url = FIREBASE_URL + (token ? '?auth=' + token : '');
    const res = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(appData)
    });
    if (res.ok) {
      showToast('Saved ✓', 'success');
    } else {
      throw new Error('HTTP ' + res.status);
    }
  } catch(e) {
    showToast('Saved locally — will sync shortly.', '');
  }
}

// ── Leads & Projects ─────────────────────────────────────────
function populateLeads() {
  const sel = document.getElementById('leadSelect');
  const leads = [...new Set(appData.projects.map(p => p.lead))].sort();
  sel.innerHTML = '<option value="">— Select lead —</option>';
  leads.forEach(l => {
    const o = document.createElement('option');
    o.value = o.textContent = l;
    sel.appendChild(o);
  });
}

function filterProjects() {
  const lead = document.getElementById('leadSelect').value;
  const sel = document.getElementById('projectSelect');
  sel.innerHTML = '<option value="">— Select project —</option>';
  document.getElementById('formSection').classList.add('hidden');
  if (!lead) return;
  appData.projects.filter(p => p.lead === lead).forEach(p => {
    const o = document.createElement('option');
    o.value = p.id; o.textContent = p.name;
    sel.appendChild(o);
  });
  sel.onchange = function() {
    if (!sel.value) { document.getElementById('formSection').classList.add('hidden'); return; }
    const p = appData.projects.find(x => x.id === sel.value);
    if (p) {
      document.getElementById('statusGeneral').value      = p.generalStatus     || 'On Track';
      document.getElementById('statusStage').value        = p.currentStage      || '';
      document.getElementById('statusStageDate').value    = p.stageDate         || '';
      document.getElementById('statusProjDeadline').value = p.projectedDeadline || '';
    }
    document.getElementById('formSection').classList.remove('hidden');
    document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
  };
}

// ── Save meeting ──────────────────────────────────────────────
async function saveMeeting() {
  const projectId = document.getElementById('projectSelect').value;
  if (!projectId) { showToast('Select a project first.', 'error'); return; }
  const date = document.getElementById('meetingDate').value;
  const proj = appData.projects.find(p => p.id === projectId);

  appData.meetings.push({
    id: 'M' + Date.now(), projectId, date, week: isoWeek(date),
    projectName: proj?.name || '', projectLead: proj?.lead || '',
    capacity:   parseInt(document.getElementById('capacitySlider').value),
    challenges: document.getElementById('qChallenges').value.trim(),
    delays:     document.getElementById('qDelays').value.trim(),
    needs:      document.getElementById('qNeeds').value.trim(),
    envChanges: document.getElementById('qEnvChanges').value.trim(),
    vibeCheck:  document.getElementById('qVibeCheck').value.trim(),
    flags:      document.getElementById('qFlags').value.trim()
  });

  const projIdx = appData.projects.findIndex(p => p.id === projectId);
  if (projIdx > -1) {
    Object.assign(appData.projects[projIdx], {
      generalStatus:    document.getElementById('statusGeneral').value,
      currentStage:     document.getElementById('statusStage').value.trim(),
      stageDate:        document.getElementById('statusStageDate').value,
      projectedDeadline:document.getElementById('statusProjDeadline').value,
      updatedAt: date
    });
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  showLoading(true);
  await saveData();
  ['qChallenges','qDelays','qNeeds','qEnvChanges','qVibeCheck','qFlags']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('capacitySlider').value = 70;
  document.getElementById('capacityVal').textContent = '70%';
  btn.disabled = false; btn.textContent = 'Save Meeting Notes';
  showLoading(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── New entry toggle ─────────────────────────────────────────
function closeAllPanels() {
  document.getElementById('newEntrySection').classList.add('hidden');
  document.getElementById('entriesPanel').classList.add('hidden');
  document.getElementById('managePanel').classList.add('hidden');
}

function toggleNewEntry() {
  const section = document.getElementById('newEntrySection');
  const isHidden = section.classList.contains('hidden');
  closeAllPanels();
  if (isHidden) { section.classList.remove('hidden'); section.scrollIntoView({ behavior: 'smooth' }); }
}

// ── Past entries ─────────────────────────────────────────────
let editingEntryId = null;

function toggleEntries() {
  const panel = document.getElementById('entriesPanel');
  const isHidden = panel.classList.contains('hidden');
  closeAllPanels();
  if (isHidden) { renderEntries(); panel.classList.remove('hidden'); }
}

function renderEntries() {
  const el = document.getElementById('entriesListEl');
  if (!appData.meetings.length) { el.innerHTML = '<p class="text-muted" style="padding:16px 20px">No entries yet.</p>'; return; }
  const sorted = [...appData.meetings].sort((a, b) => b.date.localeCompare(a.date));
  el.innerHTML = sorted.map(m => `
    <div class="entry-row">
      <div class="entry-row-main">
        <div class="entry-row-name">${esc(m.projectName)}</div>
        <div class="entry-row-meta">${m.date} · ${m.projectLead}</div>
      </div>
      <span class="entry-row-cap">${m.capacity}%</span>
      <button class="btn btn-secondary btn-sm" onclick="openEditModal('${esc(m.id)}')">Edit</button>
    </div>`).join('');
}

function openEditModal(id) {
  const m = appData.meetings.find(x => x.id === id);
  if (!m) return;
  editingEntryId = id;
  const proj = appData.projects.find(p => p.id === m.projectId);
  document.getElementById('editProjectName').value       = m.projectName || '';
  document.getElementById('editDate').value              = m.date || '';
  document.getElementById('editCapacity').value          = m.capacity || 70;
  document.getElementById('editCapacityVal').textContent = (m.capacity || 70) + '%';
  document.getElementById('editChallenges').value        = m.challenges || '';
  document.getElementById('editDelays').value            = m.delays || '';
  document.getElementById('editNeeds').value             = m.needs || '';
  document.getElementById('editEnvChanges').value        = m.envChanges || '';
  document.getElementById('editVibeCheck').value         = m.vibeCheck || '';
  document.getElementById('editFlags').value             = m.flags || '';
  document.getElementById('editStatusGeneral').value     = proj?.generalStatus     || 'On Track';
  document.getElementById('editStatusStage').value       = proj?.currentStage      || '';
  document.getElementById('editStatusStageDate').value   = proj?.stageDate         || '';
  document.getElementById('editStatusProjDeadline').value= proj?.projectedDeadline || '';
  document.getElementById('editModalBackdrop').classList.add('open');
}

function closeEditModal() {
  document.getElementById('editModalBackdrop').classList.remove('open');
  editingEntryId = null;
}

async function saveEditedEntry() {
  const idx = appData.meetings.findIndex(x => x.id === editingEntryId);
  if (idx === -1) return;
  const m = appData.meetings[idx];
  const newDate = document.getElementById('editDate').value;
  Object.assign(m, {
    date:       newDate,
    week:       isoWeek(newDate),
    capacity:   parseInt(document.getElementById('editCapacity').value),
    challenges: document.getElementById('editChallenges').value.trim(),
    delays:     document.getElementById('editDelays').value.trim(),
    needs:      document.getElementById('editNeeds').value.trim(),
    envChanges: document.getElementById('editEnvChanges').value.trim(),
    vibeCheck:  document.getElementById('editVibeCheck').value.trim(),
    flags:      document.getElementById('editFlags').value.trim()
  });
  const projIdx = appData.projects.findIndex(p => p.id === m.projectId);
  if (projIdx > -1) {
    Object.assign(appData.projects[projIdx], {
      generalStatus:     document.getElementById('editStatusGeneral').value,
      currentStage:      document.getElementById('editStatusStage').value.trim(),
      stageDate:         document.getElementById('editStatusStageDate').value,
      projectedDeadline: document.getElementById('editStatusProjDeadline').value,
      updatedAt:         newDate
    });
  }
  showLoading(true);
  await saveData();
  showLoading(false);
  closeEditModal();
  renderEntries();
}

async function deleteEntry() {
  if (!confirm('Delete this entry? This cannot be undone.')) return;
  appData.meetings = appData.meetings.filter(x => x.id !== editingEntryId);
  showLoading(true);
  await saveData();
  showLoading(false);
  closeEditModal();
  renderEntries();
}

// ── Manage projects ───────────────────────────────────────────
function toggleManage() {
  const panel = document.getElementById('managePanel');
  const isHidden = panel.classList.contains('hidden');
  closeAllPanels();
  if (isHidden) { renderProjectList(); panel.classList.remove('hidden'); }
}

function renderProjectList() {
  const el = document.getElementById('projectListEl');
  if (!appData.projects.length) { el.innerHTML = '<p class="text-muted">No projects yet.</p>'; return; }
  const sorted = [...appData.projects].sort((a,b) => a.lead.localeCompare(b.lead) || a.name.localeCompare(b.name));
  el.innerHTML = sorted.map(p =>
    `<div class="project-list-item">
      <span>${esc(p.name)}</span><small>${esc(p.lead)}</small>
      ${p.stream ? `<span class="stream-badge stream-${p.stream.toLowerCase().replace(/\s+/g,'-')}">${esc(p.stream)}</span>` : ''}
      <button class="btn btn-danger btn-sm" onclick="removeProject('${esc(p.id)}')">Remove</button>
    </div>`
  ).join('');
}

async function addProject() {
  const name   = document.getElementById('newProjectName').value.trim();
  const lead   = document.getElementById('newProjectLead').value.trim();
  const stream = document.getElementById('newProjectStream').value;
  if (!name || !lead) { showToast('Enter both name and lead.', 'error'); return; }
  appData.projects.push({ id: 'P' + Date.now(), name, lead, stream,
    generalStatus: 'On Track', currentStage: '', stageDate: '',
    projectedDeadline: '', updatedAt: '' });
  showLoading(true);
  await saveData();
  document.getElementById('newProjectName').value = '';
  document.getElementById('newProjectLead').value = '';
  document.getElementById('newProjectStream').value = '';
  populateLeads(); renderProjectList();
  showLoading(false);
}

async function removeProject(id) {
  if (!confirm('Remove this project? Meeting history remains.')) return;
  appData.projects = appData.projects.filter(p => p.id !== id);
  showLoading(true);
  await saveData();
  populateLeads(); renderProjectList();
  document.getElementById('formSection').classList.add('hidden');
  showLoading(false);
}

// ── Utils ─────────────────────────────────────────────────────
function isoWeek(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const tmp = new Date(d); tmp.setDate(tmp.getDate() + 4 - (tmp.getDay()||7));
  const y = tmp.getFullYear(), start = new Date(y,0,1);
  return y + '-W' + String(Math.ceil((((tmp-start)/86400000)+1)/7)).padStart(2,'0');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast' + (type?' '+type:''); el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}
function showLoading(show) {
  document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
}

init();

// bubble generator
(function(){
  var c=document.getElementById('bubbles');
  if(!c)return;
  for(var i=0;i<20;i++){
    var b=document.createElement('div');
    b.className='bubble';
    var s=Math.random()*130+25;
    b.style.width=s+'px';b.style.height=s+'px';
    b.style.left=(Math.random()*112-6)+'%';
    b.style.animationDuration=(Math.random()*22+14)+'s';
    b.style.animationDelay=(Math.random()*-35)+'s';
    c.appendChild(b);
  }
})();
</script>
</body>
