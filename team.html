<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Status</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:#fffbf5;color:#1e293b;font-size:15px;line-height:1.5;min-height:100vh}
.app-header{background:#fffdf9;border-bottom:1px solid #e2e8f0;padding:0 24px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.app-header h1{font-size:16px;font-weight:600;flex:1}
.container{max-width:1120px;margin:0 auto;padding:28px 20px 80px}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.toolbar-left{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.toolbar-right{display:flex;align-items:center;gap:8px}
.sort-label{font-size:13px;color:#64748b;white-space:nowrap}
.sort-select{padding:7px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:13px;background:#fff;cursor:pointer;color:#1e293b}

.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-size:13px;font-weight:500;cursor:pointer;color:#64748b;transition:all .15s}
.filter-btn:hover{border-color:#f97316;color:#f97316}
.filter-btn.active{background:#f97316;border-color:#f97316;color:#fff}

.view-toggle{display:flex;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.view-btn{padding:6px 14px;border:none;background:#fff;font-size:13px;font-weight:500;cursor:pointer;color:#64748b;transition:all .15s}
.view-btn:hover{background:#f1f5f9}
.view-btn.active{background:#f97316;color:#fff}
.view-btn+.view-btn{border-left:1px solid #e2e8f0}

/* ── Card view ── */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.proj-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px 20px;border-left:4px solid #e2e8f0}
.proj-card.on-track{border-left-color:#22c55e}
.proj-card.at-risk{border-left-color:#f59e0b}
.proj-card.delayed{border-left-color:#ef4444}
.proj-card.complete{border-left-color:#3b82f6}
.proj-card.on-hold{border-left-color:#94a3b8}
.proj-name{font-size:15px;font-weight:600;margin-bottom:2px}
.proj-lead{font-size:12px;color:#94a3b8;margin-bottom:10px}
.stream-pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;margin-bottom:10px}
.stream-Research{background:#fff7ed;color:#c2410c}
.stream-Policy{background:#dbeafe;color:#1d4ed8}
.stream-Public{background:#dcfce7;color:#15803d}
.stream-Ongoing{background:#fef3c7;color:#b45309}
.stream-Internal{background:#f1f5f9;color:#475569}
.status-pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;margin-bottom:12px}
.pill-on-track{background:#dcfce7;color:#15803d}
.pill-at-risk{background:#fef3c7;color:#b45309}
.pill-delayed{background:#fee2e2;color:#b91c1c}
.pill-complete{background:#dbeafe;color:#1d4ed8}
.pill-on-hold{background:#f1f5f9;color:#64748b}
.info-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.info-label{font-size:12px;color:#94a3b8}
.info-value{font-size:13px;font-weight:500;text-align:right}
.info-value.overdue{color:#ef4444;font-weight:600}

/* ── Calendar view ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav h2{font-size:17px;font-weight:700}
.cal-nav-btn{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:6px 14px;font-size:14px;cursor:pointer;color:#475569}
.cal-nav-btn:hover{background:#f1f5f9}
.cal-grid{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #e2e8f0}
.cal-weekday{padding:9px 0;text-align:center;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:100px;padding:8px;border-right:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;vertical-align:top}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.other-month .cal-day-num{color:#cbd5e1}
.cal-cell.today{background:#fafafe}
.cal-cell.today .cal-day-num{background:#f97316;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-day-num{font-size:13px;font-weight:500;color:#475569;margin-bottom:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.cal-chip.on-track{background:#dcfce7;color:#15803d}
.cal-chip.at-risk{background:#fef3c7;color:#b45309}
.cal-chip.delayed{background:#fee2e2;color:#b91c1c}
.cal-chip.complete{background:#dbeafe;color:#1d4ed8}
.cal-chip.on-hold{background:#f1f5f9;color:#64748b}
.cal-chip[title]:hover{opacity:.8}
.no-date-section{margin-top:20px}
.no-date-label{font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.no-date-chips{display:flex;flex-wrap:wrap;gap:6px}
.no-date-chip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;color:#64748b}

.empty{text-align:center;color:#94a3b8;padding:60px 20px;font-size:14px}
.loading{text-align:center;color:#94a3b8;padding:60px 20px;font-size:14px}
.hidden{display:none!important}


/* === Apple Liquid Glass Theme === */
body{background:linear-gradient(155deg,#b8cff5 0%,#d6e8ff 30%,#c5ddf7 55%,#a8c8f0 80%,#cce0ff 100%)!important;min-height:100vh}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.88) 0%,rgba(220,235,255,.45) 28%,rgba(180,210,255,.12) 55%,transparent 100%);border:1px solid rgba(255,255,255,.75);animation:bubbleFloat linear infinite;box-shadow:inset 0 2px 10px rgba(255,255,255,.8),inset -2px -2px 8px rgba(140,180,255,.25),0 4px 24px rgba(100,150,255,.12)}
@keyframes bubbleFloat{0%{transform:translateY(105vh) scale(.3);opacity:0}5%{opacity:.85}90%{opacity:.6}100%{transform:translateY(-140px) scale(1);opacity:0}}

/* Layout */
.container,.main-container,.dash-container{position:relative;z-index:1}

/* Header — liquid glass bar */
.app-header{background:rgba(255,255,255,.55)!important;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.7)!important;box-shadow:0 1px 0 rgba(255,255,255,.6),0 2px 16px rgba(100,150,255,.08)!important}
.app-header h1,.dash-header h2,.section-heading,.cal-nav h2{color:#0f2d5e!important}
.mode-badge{background:rgba(59,130,246,.12)!important;color:#1d4ed8!important;backdrop-filter:blur(8px)}

/* Glass cards */
.card,.proj-card,.summary-card,.manage-panel,.entries-panel,.status-section,.qa-accordion,.cal-grid,.history-entry,.flag-item,.modal{background:rgba(255,255,255,.42)!important;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.72)!important;box-shadow:0 8px 32px rgba(100,150,255,.1),0 2px 8px rgba(100,150,255,.06),inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(120,170,255,.1)!important;color:#0f2d5e;border-radius:20px!important}
.card:hover,.proj-card:hover,.summary-card:hover{background:rgba(255,255,255,.55)!important;transform:translateY(-2px);box-shadow:0 14px 40px rgba(100,150,255,.16),0 4px 12px rgba(100,150,255,.08),inset 0 1px 0 rgba(255,255,255,.95)!important;transition:all .22s ease}
.flags-section{background:rgba(255,245,235,.5)!important;border-color:rgba(255,200,150,.5)!important;backdrop-filter:blur(18px)}

/* Text */
.card-title,.form-group label,.info-label,.proj-card-label,.sort-label,.history-field .lbl,.no-date-label,.section-divider{color:#3b5ea6!important}
.proj-card-lead,.proj-lead,.text-muted,.entry-row-meta{color:#6b87b8!important}
.proj-card-name,.proj-name,.proj-card-value,.info-value,.entry-row-name,.summary-card .val,.flag-item .txt,.qa-response .resp-text,.history-field .val,.project-list-item span{color:#0f2d5e!important}
.summary-card .lbl{color:#3b5ea6!important}
.summary-card.warn .val{color:#b45309!important}
.summary-card.flag .val{color:#b91c1c!important}
.info-value.overdue,.proj-card-value.overdue{color:#dc2626!important}

/* Inputs */
.form-group select,.form-group input,.form-group textarea,.week-select,.sort-select{background:rgba(255,255,255,.5)!important;border-color:rgba(255,255,255,.7)!important;color:#0f2d5e!important;backdrop-filter:blur(8px)}
.form-group select:focus,.form-group input:focus,.form-group textarea:focus{border-color:rgba(59,130,246,.5)!important;box-shadow:0 0 0 3px rgba(59,130,246,.14)!important;background:rgba(255,255,255,.7)!important}
select option{background:#d6e8ff;color:#0f2d5e}

/* Primary button — liquid blue glass */
.btn-primary{background:linear-gradient(135deg,rgba(99,155,255,.88) 0%,rgba(59,130,246,.82) 100%)!important;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4)!important;box-shadow:0 4px 18px rgba(59,130,246,.3),0 2px 6px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.45)!important;color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn-primary:hover{background:linear-gradient(135deg,rgba(120,170,255,.92) 0%,rgba(79,150,255,.88) 100%)!important;box-shadow:0 6px 24px rgba(59,130,246,.4),inset 0 1px 0 rgba(255,255,255,.5)!important;transform:translateY(-1px)}
.btn-primary:disabled{background:rgba(147,197,253,.5)!important;box-shadow:none!important}
.btn-secondary{background:rgba(255,255,255,.4)!important;border-color:rgba(255,255,255,.65)!important;color:#1d4ed8!important;backdrop-filter:blur(8px)}
.btn-secondary:hover{background:rgba(255,255,255,.6)!important}
.btn-danger{background:rgba(254,242,242,.6)!important;border-color:rgba(252,165,165,.5)!important;color:#b91c1c!important}

/* Filter + view buttons */
.filter-btn{background:rgba(255,255,255,.38)!important;border-color:rgba(255,255,255,.65)!important;color:#1d4ed8!important;backdrop-filter:blur(8px)}
.filter-btn:hover{background:rgba(255,255,255,.55)!important;border-color:rgba(99,155,255,.5)!important}
.filter-btn.active,.view-btn.active{background:linear-gradient(135deg,rgba(99,155,255,.85),rgba(59,130,246,.8))!important;border-color:rgba(255,255,255,.4)!important;color:#fff!important;box-shadow:0 4px 14px rgba(59,130,246,.28),inset 0 1px 0 rgba(255,255,255,.4)!important}
.view-toggle{border-color:rgba(255,255,255,.6)!important;background:rgba(255,255,255,.3);backdrop-filter:blur(8px);border-radius:12px!important;overflow:hidden}
.view-btn{background:transparent!important;color:#1d4ed8!important}
.view-btn+.view-btn{border-left-color:rgba(255,255,255,.5)!important}

/* Spinner */
.spinner{border-color:rgba(100,150,255,.2)!important;border-top-color:#3b82f6!important}
.loading-overlay{background:rgba(200,220,255,.7)!important;backdrop-filter:blur(12px)}

/* Slider */
.slider-wrap input[type=range]{accent-color:#3b82f6!important}
.slider-val,.entry-row-cap,.qa-response .proj-name,.qa-cap .proj-name,.history-field .cap-big,.qa-cap .cap-num{color:#1d4ed8!important}
.cap-bar-fill{background:linear-gradient(90deg,#60a5fa,#3b82f6)!important}

/* Password gate */
#passwordGate{background:rgba(180,210,245,.75)!important;backdrop-filter:blur(20px)}
#passwordGate>div{background:rgba(255,255,255,.5)!important;backdrop-filter:blur(28px) saturate(170%);border:1px solid rgba(255,255,255,.78)!important;box-shadow:0 16px 48px rgba(100,150,255,.14),inset 0 1px 0 rgba(255,255,255,.95)!important}
#passwordGate h2{color:#0f2d5e!important}
#passwordGate p{color:#3b5ea6!important}
#passwordGate input{background:rgba(255,255,255,.55)!important;border-color:rgba(255,255,255,.7)!important;color:#0f2d5e!important}
#passwordGate button{background:linear-gradient(135deg,rgba(99,155,255,.9),rgba(59,130,246,.85))!important;box-shadow:0 4px 18px rgba(59,130,246,.3),inset 0 1px 0 rgba(255,255,255,.4)!important;border:1px solid rgba(255,255,255,.35)!important}

/* QA accordion */
.qa-item-header{background:rgba(255,255,255,.3)!important;color:#0f2d5e!important}
.qa-item-header:hover{background:rgba(255,255,255,.48)!important}
.qa-item-header .count{background:rgba(255,255,255,.5)!important;color:#1d4ed8!important}
.qa-item,.flag-item:last-child,.project-list-item{border-color:rgba(150,185,255,.15)!important}
.qa-response .resp-text,.history-field .val{color:#1e3a6e!important}
.flag-item .proj,.history-entry-date{color:#3b5ea6!important}

/* Slideover */
.slideover{background:rgba(215,232,255,.88)!important;backdrop-filter:blur(26px) saturate(160%)}
.slideover-header{background:rgba(230,242,255,.75)!important;border-color:rgba(255,255,255,.65)!important}
.slideover-header h3{color:#0f2d5e!important}

/* Modal */
.modal{background:rgba(225,238,255,.82)!important;backdrop-filter:blur(28px) saturate(160%)}
.modal-header{background:rgba(235,245,255,.78)!important;border-color:rgba(255,255,255,.65)!important}
.modal-header h3,.modal-close{color:#0f2d5e!important}
.modal-footer{border-color:rgba(150,185,255,.2)!important}

/* Manage/entries panels */
.manage-panel-header,.entries-panel-header{background:rgba(255,255,255,.32)!important;color:#0f2d5e!important;border-color:rgba(255,255,255,.6)!important}
.entry-row{border-bottom-color:rgba(150,185,255,.15)!important}
.entry-row-name{color:#0f2d5e!important}
.project-list-item span{color:#0f2d5e!important}
.project-list-item small{color:#3b5ea6!important}

/* Calendar */
.cal-weekday{color:#3b5ea6!important}
.cal-day-num{color:#1d4ed8!important}
.cal-cell.other-month .cal-day-num{color:rgba(100,140,220,.35)!important}
.cal-cell.today{background:rgba(59,130,246,.08)!important}
.cal-cell.today .cal-day-num{background:linear-gradient(135deg,#60a5fa,#3b82f6)!important;color:#fff!important;box-shadow:0 2px 8px rgba(59,130,246,.35)}
.cal-cell{border-color:rgba(150,185,255,.12)!important}
.cal-nav-btn{background:rgba(255,255,255,.42)!important;border-color:rgba(255,255,255,.68)!important;color:#1d4ed8!important;backdrop-filter:blur(8px)}
.no-date-chip{background:rgba(255,255,255,.42)!important;border-color:rgba(200,220,255,.6)!important;color:#1d4ed8!important}
.no-date-label{color:#3b5ea6!important}

/* Stream badges */
.stream-Research,.stream-research,.stream-badge.stream-research{background:rgba(167,139,250,.18)!important;color:#6d28d9!important}
.setup-banner{background:rgba(254,249,195,.6)!important;border-color:rgba(253,224,71,.5)!important;color:#854d0e!important}
.toast{background:rgba(15,45,94,.88)!important;backdrop-filter:blur(12px)}

/* === Clean/Static Mode === */
body.clean-mode{background:#eef4ff!important}
body.clean-mode #bubbles{display:none!important}
body.clean-mode .app-header{background:#fff!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-bottom:1px solid #e2e8f0!important;box-shadow:0 1px 3px rgba(0,0,0,.06)!important}
body.clean-mode .card,body.clean-mode .proj-card,body.clean-mode .summary-card,body.clean-mode .manage-panel,body.clean-mode .entries-panel,body.clean-mode .status-section,body.clean-mode .qa-accordion,body.clean-mode .cal-grid,body.clean-mode .history-entry,body.clean-mode .flag-item,body.clean-mode .modal{background:#fff!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:1px solid #e2e8f0!important;box-shadow:0 1px 4px rgba(0,0,0,.06)!important;transition:box-shadow .15s}
body.clean-mode .card:hover,body.clean-mode .proj-card:hover,body.clean-mode .summary-card:hover{transform:none!important;background:#fff!important;box-shadow:0 4px 12px rgba(0,0,0,.08)!important}
body.clean-mode .flags-section{background:#fff8f0!important;border-color:#fed7aa!important}
body.clean-mode .btn-primary{background:#3b82f6!important;backdrop-filter:none!important;box-shadow:none!important;border:none!important}
body.clean-mode .btn-primary:hover{background:#2563eb!important;transform:none!important;box-shadow:none!important}
body.clean-mode .btn-secondary{background:#f1f5f9!important;border-color:#e2e8f0!important;color:#475569!important;backdrop-filter:none!important}
body.clean-mode .btn-secondary:hover{background:#e2e8f0!important}
body.clean-mode .filter-btn{background:#fff!important;border-color:#e2e8f0!important;color:#475569!important;backdrop-filter:none!important}
body.clean-mode .filter-btn.active,body.clean-mode .view-btn.active{background:#3b82f6!important;border-color:#3b82f6!important;box-shadow:none!important}
body.clean-mode .view-toggle{background:#f1f5f9!important;border-color:#e2e8f0!important;backdrop-filter:none!important}
body.clean-mode .view-btn{background:transparent!important}
body.clean-mode .form-group select,body.clean-mode .form-group input,body.clean-mode .form-group textarea,body.clean-mode .week-select,body.clean-mode .sort-select{background:#fff!important;border-color:#cbd5e1!important;backdrop-filter:none!important}
body.clean-mode #passwordGate{background:#eef4ff!important;backdrop-filter:none!important}
body.clean-mode #passwordGate>div{background:#fff!important;backdrop-filter:none!important;border-color:#e2e8f0!important;box-shadow:0 4px 24px rgba(0,0,0,.08)!important}
body.clean-mode #passwordGate button{background:#3b82f6!important;box-shadow:none!important;border:none!important}
body.clean-mode .qa-item-header{background:#f8fafc!important;backdrop-filter:none!important}
body.clean-mode .qa-item-header:hover{background:#f1f5f9!important}
body.clean-mode .slideover{background:#fff!important;backdrop-filter:none!important}
body.clean-mode .slideover-header{background:#fff!important;border-color:#e2e8f0!important}
body.clean-mode .modal{background:#fff!important;backdrop-filter:none!important}
body.clean-mode .modal-header{background:#fff!important;border-color:#e2e8f0!important}
body.clean-mode .manage-panel-header,body.clean-mode .entries-panel-header{background:#f8fafc!important;border-color:#e2e8f0!important}
body.clean-mode .cal-nav-btn{background:#fff!important;border-color:#e2e8f0!important;backdrop-filter:none!important}
body.clean-mode .loading-overlay{background:rgba(238,244,255,.85)!important;backdrop-filter:none!important}
body.clean-mode .toast{backdrop-filter:none!important}
body.clean-mode .no-date-chip{background:#fff!important;border-color:#e2e8f0!important}

/* Toggle button */
#themeToggleBtn{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:24px;border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.38);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#1d4ed8;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(100,150,255,.18),inset 0 1px 0 rgba(255,255,255,.8);transition:all .2s;font-family:inherit}
#themeToggleBtn:hover{background:rgba(255,255,255,.55);box-shadow:0 6px 24px rgba(100,150,255,.25),inset 0 1px 0 rgba(255,255,255,.9)}
body.clean-mode #themeToggleBtn{background:#fff;border-color:#e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.08);backdrop-filter:none;color:#3b82f6}
body.clean-mode #themeToggleBtn:hover{background:#f1f5f9}
</style>
</head>
<body>
<div id="bubbles"></div>

<div id="passwordGate" style="position:fixed;inset:0;background:#fffbf5;display:flex;align-items:center;justify-content:center;z-index:1000">
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:40px;max-width:360px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)">
    <div style="font-size:28px;margin-bottom:12px">📋</div>
    <h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Project Status</h2>
    <p style="font-size:14px;color:#64748b;margin-bottom:24px">Enter the team password to continue.</p>
    <input type="password" id="passwordInput" placeholder="Password" style="width:100%;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;margin-bottom:12px;font-family:inherit;outline:none" onkeydown="if(event.key==='Enter')checkPassword()">
    <button onclick="checkPassword()" style="width:100%;padding:11px;background:#f97316;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer">Enter</button>
    <div id="pwError" style="color:#ef4444;font-size:13px;margin-top:10px;display:none">Incorrect password. Try again.</div>
  </div>
</div>

<header class="app-header">
  <h1>Project Status</h1>
</header>

<div class="container">
  <div class="toolbar">
    <div class="toolbar-left" id="streamFilters">
      <button class="filter-btn active" data-stream="">All</button>
    </div>
    <div class="toolbar-right">
      <div class="view-toggle">
        <button class="view-btn active" id="viewCards" onclick="setView('cards')">Cards</button>
        <button class="view-btn" id="viewCal" onclick="setView('calendar')">Calendar</button>
      </div>
      <span class="sort-label" id="sortLabel">Sort by</span>
      <select class="sort-select" id="sortSelect" onchange="render()">
        <option value="name">Name</option>
        <option value="deadline">Projected completion date</option>
        <option value="status">Status</option>
      </select>
    </div>
  </div>

  <!-- Cards view -->
  <div id="cardsView">
    <div class="project-grid" id="grid">
      <div class="loading">Loading projects…</div>
    </div>
  </div>

  <!-- Calendar view -->
  <div id="calView" class="hidden">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8592; Prev</button>
      <h2 id="calMonthLabel"></h2>
      <button class="cal-nav-btn" onclick="changeMonth(1)">Next &#8594;</button>
    </div>
    <div class="cal-grid">
      <div class="cal-weekdays">
        <div class="cal-weekday">Sun</div><div class="cal-weekday">Mon</div>
        <div class="cal-weekday">Tue</div><div class="cal-weekday">Wed</div>
        <div class="cal-weekday">Thu</div><div class="cal-weekday">Fri</div>
        <div class="cal-weekday">Sat</div>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>
    <div class="no-date-section" id="noDateSection" style="display:none">
      <div class="no-date-label">No completion date set</div>
      <div class="no-date-chips" id="noDateChips"></div>
    </div>
  </div>
</div>

<script>
const FIREBASE_URL = '__FIREBASE_URL__';
const FIREBASE_API_KEY = '__FIREBASE_API_KEY__';
const SITE_PASSWORD = '__SITE_PASSWORD__';
const AUTH_KEY = 'wpu_auth';

let projects = [];
let activeStream = '';
let currentView = 'cards';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let _authToken = null;

function checkAuth() {
  if (localStorage.getItem(AUTH_KEY) === SITE_PASSWORD) {
    document.getElementById('passwordGate').style.display = 'none';
  }
}

function checkPassword() {
  const input = document.getElementById('passwordInput').value;
  if (input === SITE_PASSWORD) {
    localStorage.setItem(AUTH_KEY, SITE_PASSWORD);
    document.getElementById('passwordGate').style.display = 'none';
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
  }
}

async function getAuthToken() {
  if (_authToken) return _authToken;
  try {
    const res = await fetch(
      `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ returnSecureToken: true }) }
    );
    const d = await res.json();
    _authToken = d.idToken || null;
  } catch(e) { _authToken = null; }
  return _authToken;
}

async function loadData() {
  try {
    const token = await getAuthToken();
    const url = FIREBASE_URL + '?t=' + Date.now() + (token ? '&auth=' + token : '');
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    projects = (data && data.projects) ? data.projects : [];
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="empty">Could not load projects.</div>';
    return;
  }
  buildFilters();
  render();
}

function buildFilters() {
  const streams = [...new Set(projects.map(p => p.stream).filter(Boolean))].sort();
  const container = document.getElementById('streamFilters');
  container.innerHTML = '<button class="filter-btn active" data-stream="">All</button>';
  streams.forEach(s => {
    const b = document.createElement('button');
    b.className = 'filter-btn';
    b.dataset.stream = s;
    b.textContent = s;
    container.appendChild(b);
  });
  container.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    activeStream = btn.dataset.stream;
    container.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
}

function setView(v) {
  currentView = v;
  document.getElementById('viewCards').classList.toggle('active', v === 'cards');
  document.getElementById('viewCal').classList.toggle('active', v === 'calendar');
  document.getElementById('cardsView').classList.toggle('hidden', v !== 'cards');
  document.getElementById('calView').classList.toggle('hidden', v !== 'calendar');
  document.getElementById('sortLabel').classList.toggle('hidden', v !== 'cards');
  document.getElementById('sortSelect').classList.toggle('hidden', v !== 'cards');
  render();
}

function filteredProjects() {
  return activeStream ? projects.filter(p => p.stream === activeStream) : [...projects];
}

function statusClass(s) { return (s || '').toLowerCase().replace(/\s+/g, '-'); }

function pillClass(s) {
  const map = { 'On Track': 'pill-on-track', 'At Risk': 'pill-at-risk',
                'Delayed': 'pill-delayed', 'Complete': 'pill-complete', 'On Hold': 'pill-on-hold' };
  return map[s] || 'pill-on-hold';
}

function formatDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return new Date(y, m - 1, day).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
}

function isOverdue(d) {
  if (!d) return false;
  return new Date(d) < new Date(new Date().toDateString());
}

function render() {
  if (currentView === 'calendar') renderCalendar();
  else renderCards();
}

function renderCards() {
  const sort = document.getElementById('sortSelect').value;
  let list = filteredProjects();
  if (sort === 'deadline') {
    list.sort((a, b) => {
      if (!a.projectedDeadline && !b.projectedDeadline) return 0;
      if (!a.projectedDeadline) return 1;
      if (!b.projectedDeadline) return -1;
      return a.projectedDeadline.localeCompare(b.projectedDeadline);
    });
  } else if (sort === 'status') {
    const order = ['At Risk', 'Delayed', 'On Track', 'On Hold', 'Complete'];
    list.sort((a, b) => order.indexOf(a.generalStatus) - order.indexOf(b.generalStatus));
  } else {
    list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  }
  if (!list.length) { document.getElementById('grid').innerHTML = '<div class="empty">No projects found.</div>'; return; }
  document.getElementById('grid').innerHTML = list.map(p => {
    const streamKey = (p.stream || '').split(' ')[0];
    const overdue = isOverdue(p.projectedDeadline);
    return `<div class="proj-card ${statusClass(p.generalStatus)}">
      <div class="proj-name">${esc(p.name || 'Untitled')}</div>
      <div class="proj-lead">${esc(p.lead || '')}</div>
      ${p.stream ? `<span class="stream-pill stream-${streamKey}">${esc(p.stream)}</span>` : ''}
      <span class="status-pill ${pillClass(p.generalStatus)}">${esc(p.generalStatus || 'Unknown')}</span>
      <div class="info-row"><span class="info-label">Current stage</span><span class="info-value">${esc(p.currentStage || '—')}</span></div>
      <div class="info-row"><span class="info-label">Stage date</span><span class="info-value">${formatDate(p.stageDate)}</span></div>
      <div class="info-row"><span class="info-label">Projected completion date</span><span class="info-value ${overdue ? 'overdue' : ''}">${formatDate(p.projectedDeadline)}${overdue ? ' ⚠' : ''}</span></div>
    </div>`;
  }).join('');
}

function renderCalendar() {
  const list = filteredProjects();
  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);

  document.getElementById('calMonthLabel').textContent =
    new Date(calYear, calMonth, 1).toLocaleDateString('en-CA', { month: 'long', year: 'numeric' });

  // Build a map: date string → [projects]
  const byDate = {};
  const noDate = [];
  list.forEach(p => {
    if (p.projectedDeadline) {
      (byDate[p.projectedDeadline] = byDate[p.projectedDeadline] || []).push(p);
    } else {
      noDate.push(p);
    }
  });

  // Calendar days
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  let cells = '';
  // Leading cells from previous month
  for (let i = firstDay - 1; i >= 0; i--) {
    cells += `<div class="cal-cell other-month"><div class="cal-day-num">${daysInPrev - i}</div></div>`;
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const dayProjects = byDate[dateStr] || [];
    const chips = dayProjects.map(p =>
      `<div class="cal-chip ${statusClass(p.generalStatus)}" title="${esc(p.name)} — ${esc(p.generalStatus)}">${esc(p.name)}</div>`
    ).join('');
    cells += `<div class="cal-cell${isToday ? ' today' : ''}"><div class="cal-day-num">${d}</div>${chips}</div>`;
  }
  // Trailing cells
  const totalCells = firstDay + daysInMonth;
  const trailing = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= trailing; i++) {
    cells += `<div class="cal-cell other-month"><div class="cal-day-num">${i}</div></div>`;
  }

  document.getElementById('calDays').innerHTML = cells;

  // No-date section
  const noDateSection = document.getElementById('noDateSection');
  if (noDate.length) {
    noDateSection.style.display = '';
    document.getElementById('noDateChips').innerHTML = noDate.map(p =>
      `<span class="no-date-chip">${esc(p.name)}</span>`
    ).join('');
  } else {
    noDateSection.style.display = 'none';
  }
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

checkAuth();
loadData();

// bubble generator
(function(){
  var c=document.getElementById('bubbles');
  if(!c)return;
  for(var i=0;i<20;i++){
    var b=document.createElement('div');
    b.className='bubble';
    var s=Math.random()*130+25;
    b.style.width=s+'px';b.style.height=s+'px';
    b.style.left=(Math.random()*112-6)+'%';
    b.style.animationDuration=(Math.random()*22+14)+'s';
    b.style.animationDelay=(Math.random()*-35)+'s';
    c.appendChild(b);
  }
})();

// theme toggle
(function(){
  var CLEAN='clean-mode',KEY='wpu_theme';
  function apply(clean){
    document.body.classList.toggle(CLEAN,clean);
    document.getElementById('themeToggleIcon').textContent=clean?'✦':'◈';
    document.getElementById('themeToggleLabel').textContent=clean?'Glass view':'Clean view';
  }
  window.toggleTheme=function(){
    var next=!document.body.classList.contains(CLEAN);
    localStorage.setItem(KEY,next?'clean':'glass');
    apply(next);
  };
  apply(localStorage.getItem(KEY)==='clean');
})();
</script>

<button id="themeToggleBtn" onclick="toggleTheme()">
  <span id="themeToggleIcon">✦</span>
  <span id="themeToggleLabel">Clean view</span>
</button>

</body>
</html>
